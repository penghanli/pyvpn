name: Android APK

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Test, lint, and build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Prepare APK artifact
        id: package
        working-directory: android
        run: |
          version_name="$(sed -n 's/^versionName=//p' version.properties)"
          test -n "$version_name"
          apk_name="pyvpn-android-${version_name}-debug.apk"
          mkdir -p dist
          cp "app/build/outputs/apk/debug/$apk_name" "dist/$apk_name"
          sha256sum "dist/$apk_name" > dist/SHA256SUMS
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: pyvpn-android-apk
          path: |
            android/dist/${{ steps.package.outputs.apk_name }}
            android/dist/SHA256SUMS
          if-no-files-found: error
