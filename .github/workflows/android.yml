name: Android APK

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Test, lint, and build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Prepare APK artifact
        working-directory: android
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/pyvpn-android-0.1.0-debug.apk \
            dist/pyvpn-android-0.1.0-debug.apk
          sha256sum dist/pyvpn-android-0.1.0-debug.apk > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pyvpn-android-apk
          path: |
            android/dist/pyvpn-android-0.1.0-debug.apk
            android/dist/SHA256SUMS
          if-no-files-found: error
