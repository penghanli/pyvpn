name: Windows GUI

on:
  push:
    branches: [main]
    tags:
      - "windows-v*"
    paths:
      - ".github/workflows/windows-gui.yml"
      - "src/pyvpn/**"
      - "tests/**"
      - "windows_gui/**"
      - "pyproject.toml"
      - "offline_release/build-requirements.txt"
  pull_request:
    paths:
      - ".github/workflows/windows-gui.yml"
      - "src/pyvpn/**"
      - "tests/**"
      - "windows_gui/**"
      - "pyproject.toml"
      - "offline_release/build-requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r offline_release/build-requirements.txt

      - name: Run tests
        run: python -m pytest tests offline_release/tests

      - name: Smoke test source GUI
        run: python windows_gui/entrypoint.py --smoke-test

      - name: Build single-file executable
        run: python windows_gui/build.py

      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: pyvpn-windows-x64-${{ github.sha }}
          if-no-files-found: error
          path: |
            windows_gui/dist/pyvpn.exe
            windows_gui/dist/pyvpn.exe.sha256
            windows_gui/dist/pyvpn-windows-x64-*.zip
            windows_gui/dist/pyvpn-windows-x64-*.zip.sha256

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $expected = "windows-v$(Get-Content -Raw windows_gui/VERSION)".Trim()
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Expected tag $expected, got $env:GITHUB_REF_NAME"
          }
          $assets = @(Get-ChildItem windows_gui/dist -File | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @assets `
            --title "pyvpn Windows $((Get-Content -Raw windows_gui/VERSION).Trim())" `
            --generate-notes
