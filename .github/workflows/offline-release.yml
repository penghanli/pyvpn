name: Offline release

on:
  push:
    branches:
      - main
    tags:
      - "offline-v*"
    paths:
      - "offline_release/**"
      - ".github/workflows/offline-release.yml"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - "offline_release/**"
      - ".github/workflows/offline-release.yml"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-client:
    name: Windows x64 client
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install pinned build dependencies
        run: python -m pip install -r offline_release/build-requirements.txt
      - name: Parse PowerShell installers
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "offline_release/templates/windows-client/install-client.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Run tests
        run: python -m pytest tests offline_release/tests
      - name: Build Windows offline client
        run: >
          python offline_release/build_package.py build
          --platform windows --arch x64 --role client
      - name: Smoke-test frozen client
        shell: powershell
        run: |
          $archive = "offline_release/dist/pyvpn-offline-client-windows-x64-$(Get-Content offline_release/VERSION).zip"
          Expand-Archive -LiteralPath $archive -DestinationPath smoke
          $root = Get-ChildItem smoke -Directory | Select-Object -First 1
          Remove-Item Env:PYTHONHOME -ErrorAction SilentlyContinue
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          $clientExe = Join-Path $root.FullName "payload/pyvpn-client/pyvpn-client.exe"
          $profiles = Join-Path $env:RUNNER_TEMP "pyvpn-frozen-servers.json"
          $fingerprint = "sha256:" + ("0" * 64)
          & $clientExe --help
          $env:PYVPN_TOKEN = "offline_test_token"
          & $clientExe servers --file $profiles add ci-primary `
            --server-host 203.0.113.10 --cert-fingerprint $fingerprint --use
          Remove-Item Env:PYVPN_TOKEN
          & $clientExe servers --file $profiles list --no-probe
      - name: Test fresh install, upgrade, and damaged package
        shell: powershell
        run: |
          $version = Get-Content offline_release/VERSION
          $archive = "offline_release/dist/pyvpn-offline-client-windows-x64-$version.zip"
          $testRoot = Join-Path $env:RUNNER_TEMP "pyvpn offline install test"
          $packageDir = Join-Path $testRoot "package"
          Expand-Archive -LiteralPath $archive -DestinationPath $packageDir
          $packageRoot = Get-ChildItem $packageDir -Directory | Select-Object -First 1

          $compatRoot = Join-Path $testRoot "compat"
          $legacyDir = Join-Path $compatRoot "Program Files/pyvpn-client"
          New-Item -ItemType Directory -Force -Path $legacyDir | Out-Null
          $legacyMarker = Join-Path $legacyDir "legacy.marker"
          Set-Content -Encoding ASCII -Path $legacyMarker -Value "leave unchanged"
          [Environment]::SetEnvironmentVariable(
            "ProgramW6432",
            (Join-Path $compatRoot "Program Files"),
            "Process"
          )
          [Environment]::SetEnvironmentVariable(
            "ProgramFiles",
            (Join-Path $compatRoot "Program Files"),
            "Process"
          )
          [Environment]::SetEnvironmentVariable(
            "ProgramFiles(x86)",
            (Join-Path $compatRoot "Program Files (x86)"),
            "Process"
          )
          $installDir = Join-Path $packageRoot.FullName "pyvpn-client"
          $configDir = Join-Path $installDir "config"
          $installer = Join-Path $packageRoot.FullName "install-client.ps1"
          $fingerprint = "sha256:" + ("0" * 64)

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installer `
            -ServerId "ci-primary" `
            -ServerHost "203.0.113.10" `
            -Token "offline_test_token" `
            -CertFingerprint $fingerprint
          if ($LASTEXITCODE -ne 0) { throw "Fresh offline install failed." }
          $profilesPath = Join-Path $configDir "servers.json"
          $serversScript = Join-Path $installDir "pyvpn-client-servers.ps1"
          $env:PYVPN_TOKEN = "offline_backup_token"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $serversScript `
            add ci-backup --server-host 198.51.100.20 `
            --cert-fingerprint $fingerprint --use
          $profileExit = $LASTEXITCODE
          Remove-Item Env:PYVPN_TOKEN
          if ($profileExit -ne 0) { throw "Could not add a second server profile." }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $serversScript list --no-probe
          if ($LASTEXITCODE -ne 0) { throw "Could not list saved server profiles." }
          $profileStore = Get-Content -Raw $profilesPath | ConvertFrom-Json
          if ($profileStore.active_server_id -ne "ci-backup" -or
              -not $profileStore.servers.'ci-primary' -or
              -not $profileStore.servers.'ci-backup') {
            throw "Fresh install did not create the expected server profiles."
          }
          $configHash = (Get-FileHash -Algorithm SHA256 $profilesPath).Hash

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installer
          if ($LASTEXITCODE -ne 0) { throw "Offline upgrade failed." }
          if ((Get-FileHash -Algorithm SHA256 $profilesPath).Hash -ne $configHash) {
            throw "Offline upgrade did not preserve the client configuration."
          }
          if (-not (Test-Path (Join-Path $installDir "runtime.previous"))) {
            throw "Offline upgrade did not retain the previous runtime."
          }
          $launcherNames = @("start", "up", "down", "status", "servers", "switch")
          foreach ($launcherName in $launcherNames) {
            $launcher = Join-Path $installDir "pyvpn-client-$launcherName.ps1"
            if (-not (Test-Path $launcher)) {
              throw "Local client launcher was not created: $launcherName"
            }
            $launcherTokens = $null
            $launcherErrors = $null
            $launcherAst = [System.Management.Automation.Language.Parser]::ParseFile(
              $launcher,
              [ref]$launcherTokens,
              [ref]$launcherErrors
            )
            if ($launcherErrors.Count -gt 0) {
              $launcherErrors | ForEach-Object { Write-Error "$launcherName`: $($_.Message)" }
              throw "Generated client launcher contains PowerShell syntax errors: $launcherName"
            }
            $orphanOptions = @($launcherAst.FindAll({
              param($node)
              $node -is [System.Management.Automation.Language.CommandAst] -and
                $node.GetCommandName() -match '^-'
            }, $true))
            if ($orphanOptions.Count -gt 0) {
              throw "Generated client launcher contains an orphaned option command: $launcherName"
            }
          }
          $upScript = Join-Path $installDir "pyvpn-client-up.ps1"
          if ((Get-Content -Raw $upScript) -notmatch 'Start-Process @startProcessParams') {
            throw "Generated client launcher does not use stable Start-Process splatting."
          }
          $statusScript = Join-Path $installDir "pyvpn-client-status.ps1"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $statusScript
          if ($LASTEXITCODE -ne 0) { throw "Generated status launcher failed." }

          $startScript = Join-Path $installDir "pyvpn-client-start.ps1"
          $downScript = Join-Path $installDir "pyvpn-client-down.ps1"
          $runtimeExe = Join-Path $installDir "runtime/pyvpn-client.exe"
          $runtimeBackup = "$runtimeExe.real"
          $argumentsFile = Join-Path $testRoot "captured client arguments.txt"
          $fakeRuntimeSource = @'
          using System;
          using System.IO;
          using System.Threading;

          public static class Program
          {
              public static int Main(string[] args)
              {
                  string output = Environment.GetEnvironmentVariable("PYVPN_TEST_ARGS");
                  if (String.IsNullOrEmpty(output)) return 2;
                  File.WriteAllLines(output, args);
                  int stopIndex = Array.IndexOf(args, "--stop-file");
                  if (stopIndex < 0 || stopIndex + 1 >= args.Length) return 3;
                  for (int i = 0; i < 300; i++)
                  {
                      if (File.Exists(args[stopIndex + 1])) return 0;
                      Thread.Sleep(100);
                  }
                  return 4;
              }
          }
          '@
          Move-Item -LiteralPath $runtimeExe -Destination $runtimeBackup
          try {
            Add-Type -TypeDefinition $fakeRuntimeSource -OutputAssembly $runtimeExe `
              -OutputType ConsoleApplication
            $env:PYVPN_TEST_ARGS = $argumentsFile
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $upScript
            if ($LASTEXITCODE -ne 0) { throw "Generated up launcher failed." }
            $actualArguments = @(Get-Content -LiteralPath $argumentsFile)
            $expectedArguments = @(
              "--profiles", $profilesPath,
              "--stop-file", (Join-Path $configDir "client.stop")
            )
            if (($actualArguments -join "`n") -ne ($expectedArguments -join "`n")) {
              throw "Generated start launcher did not preserve argument boundaries."
            }
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $downScript
            if ($LASTEXITCODE -ne 0) { throw "Generated down launcher failed." }
          } finally {
            Remove-Item Env:PYVPN_TEST_ARGS -ErrorAction SilentlyContinue
            if (Test-Path (Join-Path $configDir "client.pid")) {
              & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $downScript *> $null
            }
            Remove-Item -Force -LiteralPath $runtimeExe -ErrorAction SilentlyContinue
            Move-Item -LiteralPath $runtimeBackup -Destination $runtimeExe
          }
          if ((Get-Content -Raw $legacyMarker).Trim() -ne "leave unchanged" -or
              (Test-Path (Join-Path $legacyDir "runtime"))) {
            throw "The local installer changed an older system-wide installation."
          }

          $damagedDir = Join-Path $testRoot "damaged"
          Expand-Archive -LiteralPath $archive -DestinationPath $damagedDir
          $damagedRoot = Get-ChildItem $damagedDir -Directory | Select-Object -First 1
          Add-Content -LiteralPath (Join-Path $damagedRoot.FullName "README.en.md") -Value "damaged"
          $rejectedInstall = Join-Path $testRoot "rejected-install"
          $rejectedConfig = Join-Path $testRoot "rejected-config"
          $rejectLog = Join-Path $testRoot "damaged-package.log"
          $previousErrorAction = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass `
              -File (Join-Path $damagedRoot.FullName "install-client.ps1") `
              -ServerHost "203.0.113.10" `
              -Token "offline_test_token" `
              -CertFingerprint $fingerprint `
              -InstallDir $rejectedInstall `
              -ConfigDir $rejectedConfig *> $rejectLog
            $rejectExit = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $previousErrorAction
          }
          if ($rejectExit -eq 0) { throw "Damaged package was accepted." }
          if ((Test-Path $rejectedInstall) -or (Test-Path $rejectedConfig)) {
            throw "Damaged package changed target directories."
          }

          $wrongArchDir = Join-Path $testRoot "wrong-arch"
          Expand-Archive -LiteralPath $archive -DestinationPath $wrongArchDir
          $wrongArchRoot = Get-ChildItem $wrongArchDir -Directory | Select-Object -First 1
          $metadata = Join-Path $wrongArchRoot.FullName "PACKAGE-METADATA"
          $metadataText = (Get-Content -Raw $metadata).Replace("ARCH=x64", "ARCH=arm64")
          [IO.File]::WriteAllText($metadata, $metadataText, [Text.Encoding]::ASCII)
          $metadataHash = (Get-FileHash -Algorithm SHA256 $metadata).Hash.ToLowerInvariant()
          $manifest = Join-Path $wrongArchRoot.FullName "SHA256SUMS"
          $manifestLines = Get-Content $manifest | ForEach-Object {
            if ($_ -match "  PACKAGE-METADATA$") {
              "$metadataHash  PACKAGE-METADATA"
            } else {
              $_
            }
          }
          [IO.File]::WriteAllLines($manifest, $manifestLines, [Text.Encoding]::ASCII)
          $wrongArchInstall = Join-Path $testRoot "wrong-arch-install"
          $wrongArchConfig = Join-Path $testRoot "wrong-arch-config"
          $wrongArchLog = Join-Path $testRoot "wrong-arch.log"
          $ErrorActionPreference = "Continue"
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass `
              -File (Join-Path $wrongArchRoot.FullName "install-client.ps1") `
              -ServerHost "203.0.113.10" `
              -Token "offline_test_token" `
              -CertFingerprint $fingerprint `
              -InstallDir $wrongArchInstall `
              -ConfigDir $wrongArchConfig *> $wrongArchLog
            $wrongArchExit = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $previousErrorAction
          }
          if ($wrongArchExit -eq 0) { throw "Wrong-architecture package was accepted." }
          if ((Test-Path $wrongArchInstall) -or (Test-Path $wrongArchConfig)) {
            throw "Wrong-architecture package changed target directories."
          }
          exit 0
      - name: Confirm existing online files are untouched
        run: git diff --exit-code -- README.md src scripts
      - uses: actions/upload-artifact@v4
        with:
          name: offline-windows-x64
          path: offline_release/dist/pyvpn-offline-client-windows-x64-*.zip
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            container: quay.io/pypa/manylinux_2_28_x86_64:latest
            python: /opt/pyvpn-python/bin/python3.12
          - arch: arm64
            runner: ubuntu-22.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64:latest
            python: /opt/pyvpn-python/bin/python3.12
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Install Linux build dependencies
        run: |
          dnf -y install \
            bzip2-devel \
            expat-devel \
            gdbm-devel \
            libffi-devel \
            libuuid-devel \
            ncurses-devel \
            openssl-devel \
            iproute \
            procps-ng \
            readline-devel \
            sqlite-devel \
            xz \
            xz-devel \
            zlib-devel
      - uses: actions/checkout@v6
      - name: Snapshot existing online files
        run: |
          find README.md src scripts -type f \
            ! -path '*/__pycache__/*' ! -name '*.pyc' ! -name '*.pyo' -print0 \
            | sort -z \
            | xargs -0 sha256sum > /tmp/pyvpn-online-files.sha256
          find README.md src scripts -type f \
            ! -path '*/__pycache__/*' ! -name '*.pyc' ! -name '*.pyo' \
            -printf '%m %p\n' \
            | sort > /tmp/pyvpn-online-files.modes
      - name: Build shared Python 3.12
        env:
          PYTHON_SOURCE_VERSION: "3.12.13"
          PYTHON_SOURCE_SHA256: "c08bc65a81971c1dd5783182826503369466c7e67374d1646519adf05207b684"
        run: |
          SOURCE_ARCHIVE="/tmp/Python-${PYTHON_SOURCE_VERSION}.tar.xz"
          curl --fail --location --retry 3 \
            "https://www.python.org/ftp/python/${PYTHON_SOURCE_VERSION}/Python-${PYTHON_SOURCE_VERSION}.tar.xz" \
            --output "$SOURCE_ARCHIVE"
          echo "${PYTHON_SOURCE_SHA256}  ${SOURCE_ARCHIVE}" | sha256sum --check
          tar -xJf "$SOURCE_ARCHIVE" -C /tmp
          cd "/tmp/Python-${PYTHON_SOURCE_VERSION}"
          ./configure \
            --prefix=/opt/pyvpn-python \
            --enable-shared \
            --with-ensurepip=install \
            --disable-test-modules
          make -j"$(nproc)"
          make install
          echo "/opt/pyvpn-python/lib" > /etc/ld.so.conf.d/pyvpn-python.conf
          ldconfig
          ${{ matrix.python }} --version
      - name: Install pinned build dependencies
        run: ${{ matrix.python }} -m pip install -r offline_release/build-requirements.txt
      - name: Parse shell installers
        run: |
          bash -n offline_release/templates/linux-client/install-client.sh
          bash -n offline_release/templates/linux-server/install-server.sh
      - name: Run tests
        run: ${{ matrix.python }} -m pytest tests offline_release/tests
      - name: Build Linux client
        run: >
          ${{ matrix.python }} offline_release/build_package.py build
          --platform linux --arch ${{ matrix.arch }} --role client
      - name: Build Linux server
        run: >
          ${{ matrix.python }} offline_release/build_package.py build
          --platform linux --arch ${{ matrix.arch }} --role server
      - name: Smoke-test frozen programs
        run: |
          mkdir -p smoke-client smoke-server
          tar -xzf offline_release/dist/pyvpn-offline-client-linux-${{ matrix.arch }}-*.tar.gz -C smoke-client
          tar -xzf offline_release/dist/pyvpn-offline-server-linux-${{ matrix.arch }}-*.tar.gz -C smoke-server
          CLIENT_ROOT="$(find smoke-client -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          SERVER_ROOT="$(find smoke-server -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          env -u PYTHONHOME -u PYTHONPATH "$CLIENT_ROOT/payload/pyvpn-client/pyvpn-client" --help
          env -u PYTHONHOME -u PYTHONPATH "$SERVER_ROOT/payload/pyvpn-server/pyvpn-server" --help
          env -u PYTHONHOME -u PYTHONPATH "$SERVER_ROOT/payload/pyvpn-tools/pyvpn-tools" --help
          PROFILES="/tmp/pyvpn-frozen-servers-${{ matrix.arch }}.json"
          env PYVPN_TOKEN=offline_test_token \
            "$CLIENT_ROOT/payload/pyvpn-client/pyvpn-client" \
            servers --file "$PROFILES" add ci-primary \
            --server-host 203.0.113.10 \
            --cert-fingerprint "sha256:$(printf '0%.0s' {1..64})" --use
          "$CLIENT_ROOT/payload/pyvpn-client/pyvpn-client" \
            servers --file "$PROFILES" list --no-probe
      - name: Test missing host-component preflight
        shell: bash
        run: |
          CLIENT_ROOT="$(find smoke-client -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          SERVER_ROOT="$(find smoke-server -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          CLIENT_INSTALL="/tmp/pyvpn-rejected-client-${{ matrix.arch }}"
          CLIENT_CONFIG="/tmp/pyvpn-rejected-client-config-${{ matrix.arch }}"
          SERVER_INSTALL="/tmp/pyvpn-rejected-server-${{ matrix.arch }}"
          SERVER_CONFIG="/tmp/pyvpn-rejected-server-config-${{ matrix.arch }}"
          if [[ ! -e /dev/net/tun ]]; then
            if "$CLIENT_ROOT/install-client.sh" \
              --server-host 127.0.0.1 \
              --token offline_test_token \
              --cert-fingerprint "sha256:$(printf '0%.0s' {1..64})" \
              --install-dir "$CLIENT_INSTALL" \
              --config-dir "$CLIENT_CONFIG" >/tmp/client-preflight.log 2>&1; then
              echo "Client installer unexpectedly accepted a system without TUN" >&2
              exit 1
            fi
          else
            echo "TUN is available in the build container; skipping client negative preflight"
          fi
          if [[ ! -d /run/systemd/system ]]; then
            if "$SERVER_ROOT/install-server.sh" \
              --public-host 127.0.0.1 \
              --token offline_test_token \
              --install-dir "$SERVER_INSTALL" \
              --config-dir "$SERVER_CONFIG" >/tmp/server-preflight.log 2>&1; then
              echo "Server installer unexpectedly accepted a system without systemd" >&2
              exit 1
            fi
          else
            echo "systemd is active in the build container; skipping server negative preflight"
          fi
          if [[ -e "$CLIENT_INSTALL" || -e "$CLIENT_CONFIG" ||
                -e "$SERVER_INSTALL" || -e "$SERVER_CONFIG" ]]; then
            echo "Failed preflight changed an installation target" >&2
            exit 1
          fi
      - name: Install and validate generated Linux helpers
        shell: bash
        run: |
          CLIENT_ROOT="$(find smoke-client -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          SERVER_ROOT="$(find smoke-server -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          CLIENT_INSTALL="/tmp/pyvpn generated client ${{ matrix.arch }}"
          CLIENT_CONFIG="$CLIENT_INSTALL/config"
          FINGERPRINT="sha256:$(printf '0%.0s' {1..64})"
          mkdir -p /dev/net
          [[ -e /dev/net/tun ]] || touch /dev/net/tun

          "$CLIENT_ROOT/install-client.sh" \
            --server-host 203.0.113.10 \
            --token offline_test_token \
            --cert-fingerprint "$FINGERPRINT" \
            --install-dir "$CLIENT_INSTALL" \
            --config-dir "$CLIENT_CONFIG"
          for name in start up down status servers switch; do
            helper="$CLIENT_INSTALL/pyvpn-client-$name"
            [[ -x "$helper" ]] || { echo "Missing generated helper: $helper" >&2; exit 1; }
            bash -n "$helper"
          done
          "$CLIENT_INSTALL/pyvpn-client-servers" list --no-probe
          "$CLIENT_INSTALL/pyvpn-client-status"

          TEST_BIN="/tmp/pyvpn-systemd-test-bin-${{ matrix.arch }}"
          SYSTEMD_STATE="/tmp/pyvpn-systemd-state-${{ matrix.arch }}"
          SERVER_INSTALL="/tmp/pyvpn-server-${{ matrix.arch }}"
          SERVER_CONFIG="/tmp/pyvpn-server-config-${{ matrix.arch }}"
          mkdir -p "$TEST_BIN" /run/systemd/system
          export PYVPN_TEST_SYSTEMD_STATE="$SYSTEMD_STATE"
          cat > "$TEST_BIN/systemctl" <<'SH'
          #!/usr/bin/env bash
          case "${1:-}" in
            is-active) [[ -f "$PYVPN_TEST_SYSTEMD_STATE" ]] ;;
            is-enabled) exit 1 ;;
            enable) touch "$PYVPN_TEST_SYSTEMD_STATE" ;;
            *) exit 0 ;;
          esac
          SH
          cat > "$TEST_BIN/nft" <<'SH'
          #!/usr/bin/env bash
          exit 0
          SH
          chmod 755 "$TEST_BIN/systemctl" "$TEST_BIN/nft"
          export PATH="$TEST_BIN:$PATH"
          "$SERVER_ROOT/install-server.sh" \
            --public-host 203.0.113.10 \
            --token offline_test_token \
            --install-dir "$SERVER_INSTALL" \
            --config-dir "$SERVER_CONFIG"
          for helper in pyvpn-server-restart pyvpn-server-status pyvpn-server-logs; do
            bash -n "/usr/local/bin/$helper"
          done
          grep -Fx 'PYVPN_MAX_CLIENTS=5' "$SERVER_CONFIG/server.env"
          grep -F -- '--max-clients ${PYVPN_MAX_CLIENTS}' /etc/systemd/system/pyvpn-server.service
      - name: Confirm existing online files are untouched
        run: |
          find README.md src scripts -type f \
            ! -path '*/__pycache__/*' ! -name '*.pyc' ! -name '*.pyo' -print0 \
            | sort -z \
            | xargs -0 sha256sum > /tmp/pyvpn-online-files-current.sha256
          find README.md src scripts -type f \
            ! -path '*/__pycache__/*' ! -name '*.pyc' ! -name '*.pyo' \
            -printf '%m %p\n' \
            | sort > /tmp/pyvpn-online-files-current.modes
          cmp /tmp/pyvpn-online-files.sha256 /tmp/pyvpn-online-files-current.sha256
          cmp /tmp/pyvpn-online-files.modes /tmp/pyvpn-online-files-current.modes
      - uses: actions/upload-artifact@v4
        with:
          name: offline-linux-${{ matrix.arch }}
          path: |
            offline_release/dist/pyvpn-offline-client-linux-${{ matrix.arch }}-*.tar.gz
            offline_release/dist/pyvpn-offline-server-linux-${{ matrix.arch }}-*.tar.gz
          if-no-files-found: error

  macos-client:
    name: macOS ${{ matrix.arch }} client
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            python_arch: x64
            requirements: offline_release/build-requirements-macos-x86_64.txt
          - arch: arm64
            runner: macos-15
            python_arch: arm64
            requirements: offline_release/build-requirements.txt
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}
      - name: Prepare Intel macOS cryptography build
        if: matrix.arch == 'x86_64'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
          echo "PIP_NO_BINARY=cryptography" >> "$GITHUB_ENV"
      - name: Install pinned build dependencies
        run: python -m pip install -r ${{ matrix.requirements }}
      - name: Parse macOS installer
        run: bash -n offline_release/templates/macos-client/install-client.sh
      - name: Run tests
        run: python -m pytest tests offline_release/tests
      - name: Build macOS offline client
        run: >
          python offline_release/build_package.py build
          --platform macos --arch ${{ matrix.arch }} --role client
      - name: Smoke-test frozen client
        run: |
          mkdir -p smoke
          tar -xzf offline_release/dist/pyvpn-offline-client-macos-${{ matrix.arch }}-*.tar.gz -C smoke
          PACKAGE_ROOT="$(find smoke -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          env -u PYTHONHOME -u PYTHONPATH "$PACKAGE_ROOT/payload/pyvpn-client/pyvpn-client" --help
          env -u PYTHONHOME -u PYTHONPATH "$PACKAGE_ROOT/payload/pyvpn-client-tools/pyvpn-client-tools" --help
          PROFILES="$RUNNER_TEMP/pyvpn-frozen-servers-${{ matrix.arch }}.json"
          env PYVPN_TOKEN=offline_test_token \
            "$PACKAGE_ROOT/payload/pyvpn-client/pyvpn-client" \
            servers --file "$PROFILES" add ci-primary \
            --server-host 203.0.113.10 \
            --cert-fingerprint "sha256:$(printf '0%.0s' {1..64})" --use
          "$PACKAGE_ROOT/payload/pyvpn-client/pyvpn-client" \
            servers --file "$PROFILES" list --no-probe
      - name: Install and validate generated macOS helpers
        run: |
          PACKAGE_ROOT="$(find smoke -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          INSTALL_ROOT="$RUNNER_TEMP/pyvpn generated macos client ${{ matrix.arch }}"
          CONFIG_ROOT="$INSTALL_ROOT/config"
          FINGERPRINT="sha256:$(printf '0%.0s' {1..64})"
          sudo "$PACKAGE_ROOT/install-client.sh" \
            --server-host 203.0.113.10 \
            --token offline_test_token \
            --cert-fingerprint "$FINGERPRINT" \
            --install-dir "$INSTALL_ROOT" \
            --config-dir "$CONFIG_ROOT"
          for name in start up down status servers switch; do
            helper="$INSTALL_ROOT/pyvpn-client-$name"
            sudo test -x "$helper"
            sudo bash -n "$helper"
          done
          sudo "$INSTALL_ROOT/pyvpn-client-servers" list --no-probe
          sudo "$INSTALL_ROOT/pyvpn-client-status"
      - name: Verify macOS 12 deployment target
        run: |
          PACKAGE_ROOT="$(find smoke -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          python - "$PACKAGE_ROOT" <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          checked = 0
          too_new = []
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              kind = subprocess.run(
                  ["file", str(path)],
                  check=True,
                  text=True,
                  stdout=subprocess.PIPE,
              ).stdout
              if "Mach-O" not in kind:
                  continue
              checked += 1
              load_commands = subprocess.run(
                  ["otool", "-l", str(path)],
                  check=True,
                  text=True,
                  stdout=subprocess.PIPE,
              ).stdout
              versions = re.findall(r"\bminos\s+([0-9.]+)", load_commands)
              versions += re.findall(
                  r"LC_VERSION_MIN_MACOSX.*?\bversion\s+([0-9.]+)",
                  load_commands,
                  flags=re.DOTALL,
              )
              for value in versions:
                  parts = tuple(int(part) for part in value.split("."))
                  normalized = (parts + (0, 0, 0))[:3]
                  if normalized > (12, 0, 0):
                      too_new.append(f"{path.relative_to(root)}: {value}")
          if checked == 0:
              raise SystemExit("No Mach-O files found in macOS package")
          if too_new:
              raise SystemExit("macOS deployment target is too new:\n" + "\n".join(too_new))
          print(f"Verified macOS 12 target across {checked} Mach-O files")
          PY
      - name: Confirm existing online files are untouched
        run: git diff --exit-code -- README.md src scripts
      - uses: actions/upload-artifact@v4
        with:
          name: offline-macos-${{ matrix.arch }}
          path: offline_release/dist/pyvpn-offline-client-macos-${{ matrix.arch }}-*.tar.gz
          if-no-files-found: error

  assemble:
    name: Assemble release
    needs:
      - windows-client
      - linux
      - macos-client
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: release-input
          merge-multiple: true
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/offline-v')
        run: |
          EXPECTED_TAG="offline-v$(cat offline_release/VERSION)"
          if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match $EXPECTED_TAG" >&2
            exit 1
          fi
      - name: Assemble and verify all-platform release
        run: |
          python offline_release/build_package.py assemble \
            --input-dir release-input \
            --output-dir release-output
          for archive in release-output/*.zip release-output/*.tar.gz; do
            python offline_release/build_package.py verify "$archive"
          done
          (cd release-output && sha256sum --check --quiet SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: pyvpn-offline-release
          path: release-output/*
          if-no-files-found: error

  release:
    name: Create prerelease
    if: startsWith(github.ref, 'refs/tags/offline-v')
    needs:
      - assemble
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pyvpn-offline-release
          path: release-output
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-output/* \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            VERSION="${GITHUB_REF_NAME#offline-v}"
            gh release create "$GITHUB_REF_NAME" release-output/* \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "pyvpn offline $VERSION" \
              --notes "Self-contained offline packages for Windows, Linux, and macOS. See the README inside the archive matching the target system."
          fi
